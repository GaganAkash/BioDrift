package_id: "fixture-compositional"
version_family: "1.x"
environment:
  os: "linux"
  python_versions: ["3.10", "3.11", "3.12"]
  architecture: "*"
phase_rules:
  - phase: "execution"
    allowed_capabilities: ["file_read", "file_write", "module_load"]
    coverage_required: true
capability_rules:
  - capability: "file_read"
    allowed_resources: ["/tmp/*"]
    allowed_destinations: []
    allowed_actions: ["open", "read"]
    blocked: false
    severity: "low"
  - capability: "file_write"
    allowed_resources: ["/tmp/*"]
    allowed_destinations: []
    allowed_actions: ["open", "write"]
    blocked: false
    severity: "low"
  - capability: "module_load"
    allowed_resources: ["*"]
    allowed_destinations: []
    allowed_actions: ["import"]
    blocked: false
    severity: "low"
coverage_threshold: 0.9
provenance:
  source_url: "https://example.com/fixture-compositional"
  source_hash: "sha256:local-fixture"
  created_by: "benchmark"
  verified_by: ["benchmark"]
  admitted_by: "benchmark"
admission_status: "admitted"