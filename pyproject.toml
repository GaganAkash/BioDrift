[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biodrift"
version = "0.1.0"
description = "Contextual behavioral verification for Python packages under incomplete observation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "BioDrift" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ebpf = [
    "bcc>=0.29",
]
full = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
biodrift = "biodrift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/biodrift"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["biodrift.storage.repositories"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tomllib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-v"]
