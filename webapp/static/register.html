<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioDrift · Create account</title>
<style>
  :root {
    --ok:      #3fb950;
    --warn:    #d29922;
    --bad:     #f85149;
    --info:    #58a6ff;
    --ink:     #e6edf3;
    --ink-dim: #8b949e;
    --bg:      #0a0e0d;
    --panel:   #10161a;
    --panel-2: #0c1114;
    --line:    #222b31;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: grid; place-items: center; padding: 1rem;
    background: var(--bg);
    background-image: radial-gradient(700px 400px at 50% 0%, rgba(63,185,80,0.06), transparent 60%);
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 2.2rem 2rem 1.8rem;
    text-align: center;
  }
  .shield {
    width: 44px; height: 50px; position: relative;
    filter: drop-shadow(0 0 12px rgba(63,185,80,0.3));
    margin: 0 auto 1rem;
  }
  .shield::before {
    content: ""; position: absolute; inset: 0;
    clip-path: polygon(50% 0, 96% 14%, 90% 70%, 50% 100%, 10% 70%, 4% 14%);
    background: linear-gradient(160deg, var(--ok), var(--info));
  }
  .shield::after {
    content: "✚"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #04130f; font-weight: 800; font-size: 1.1rem;
  }
  h1 { margin: 0 0 .2rem; font-size: 1.3rem; letter-spacing: .5px; font-family: var(--mono); }
  p.tag { margin: 0 0 1.6rem; color: var(--ink-dim); font-size: .8rem; }
  form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
  label { font-size: .78rem; color: var(--ink-dim); display: flex; flex-direction: column; gap: .35rem; }
  input {
    padding: .6rem .8rem;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink); font-size: .92rem; outline: none;
    transition: border .15s ease, box-shadow .15s ease;
  }
  input:focus { border-color: var(--ok); box-shadow: 0 0 0 2px rgba(63,185,80,0.15); }
  button {
    margin-top: .4rem; padding: .65rem;
    border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: .9rem; color: #04130f;
    background: var(--ok);
    box-shadow: 0 0 0 1px rgba(63,185,80,0.35);
    transition: filter .12s ease;
  }
  button:hover { filter: brightness(1.1); }
  .err { margin: 1rem 0 0; color: var(--bad); font-size: .78rem; font-family: var(--mono); }
  .muted { color: var(--ink-dim); }
  .hint { margin: 1.3rem 0 0; color: var(--ink-dim); font-size: .76rem; }
  .hint a { color: var(--info); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="shield"></div>
  <h1>Create account</h1>
  <p class="tag">Self-service signup — you get a researcher role</p>
  <form method="post" action="/register">
    <label>Username
      <input name="username" autocomplete="username" required autofocus pattern="[A-Za-z0-9_.\-]{2,32}">
    </label>
    <label>Email
      <input name="email" type="email" autocomplete="email" placeholder="name@domain.tld"
             required title="Required — used to send encrypted CSV test results.">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="err" id="err" style="display:none"></p>
  <p class="hint">Research access only — admins can promote your role.</p>
  <p class="hint">Already have an account? <a href="/login">Sign in</a></p>
</div>
<script>
  const msg = new URLSearchParams(location.search).get("error");
  if (msg) { const e = document.getElementById("err"); e.style.display = "block"; e.textContent = msg; }
</script>
</body>
</html>
