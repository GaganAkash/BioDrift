<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioDrift · Sign in</title>
<style>
  :root {
    --accent: #7ef0c8;
    --accent2: #38bdf8;
    --ink: #e8f6f0;
    --ink-dim: #9fb8af;
    --glass: rgba(12, 30, 26, 0.42);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-high: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: grid; place-items: center; padding: 1rem;
    background:
      radial-gradient(1200px 800px at 12% -10%, rgba(56,189,248,0.22), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(126,240,200,0.18), transparent 55%),
      radial-gradient(800px 600px at 80% 110%, rgba(120,80,255,0.20), transparent 60%),
      linear-gradient(160deg, #04130f 0%, #061a15 45%, #051018 100%);
    background-attachment: fixed;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(126,240,200,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(126,240,200,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  }
  .glass {
    position: relative; z-index: 1;
    width: 100%; max-width: 380px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 var(--glass-high);
    padding: 2.2rem 2rem 1.8rem;
    text-align: center;
  }
  .shield {
    width: 54px; height: 60px; position: relative;
    filter: drop-shadow(0 0 16px rgba(126,240,200,0.5));
    margin: 0 auto 1rem;
  }
  .shield::before {
    content: ""; position: absolute; inset: 0;
    clip-path: polygon(50% 0, 96% 14%, 90% 70%, 50% 100%, 10% 70%, 4% 14%);
    background: linear-gradient(160deg, var(--accent), var(--accent2));
  }
  .shield::after {
    content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
    color: #04130f; font-weight: 800; font-size: 1.3rem;
  }
  h1 { margin: 0 0 .2rem; font-size: 1.35rem; letter-spacing: .5px; }
  p.tag { margin: 0 0 1.6rem; color: var(--ink-dim); font-size: .85rem; }
  form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
  label { font-size: .8rem; color: var(--ink-dim); display: flex; flex-direction: column; gap: .35rem; }
  input {
    padding: .65rem .9rem;
    border-radius: 10px; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.06);
    color: var(--ink); font-size: .95rem; outline: none;
    transition: border .2s ease, box-shadow .2s ease;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(126,240,200,0.15); }
  button {
    margin-top: .4rem; padding: .75rem;
    border: none; border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: .95rem; color: #04130f;
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    transition: transform .15s ease, box-shadow .2s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(126,240,200,0.35); }
  .err {
    margin: 1rem 0 0; color: #ff5c5c; font-size: .82rem;
  }
  .hint { margin: 1.4rem 0 0; color: var(--ink-dim); font-size: .75rem; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="glass">
  <div class="shield"></div>
  <h1>BioDrift</h1>
  <p class="tag">Context-aware package vetting console</p>
  <form method="post" action="/login">
    <label>Username
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="err" id="err" style="display:none">Invalid credentials. Try again.</p>
  <p class="hint">Default demo login: admin / biodrift</p>
</div>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("err").style.display = "block";
</script>
</body>
</html>
